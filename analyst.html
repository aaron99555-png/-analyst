<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>分析師即時績效表</title>
<style>
:root{
  --bg:#0d0b08;--panel:#17120c;--panel2:#21190f;--gold:#d9b24c;--gold2:#f4d77d;--text:#f6f0df;
  --muted:#b8aa87;--line:#3b2e18;--green:#45d483;--red:#ff6b6b;--blue:#7bb8ff;--shadow:0 12px 36px rgba(0,0,0,.28)
}
*{box-sizing:border-box} body{margin:0;font-family:Inter,"Noto Sans TC",system-ui,-apple-system,sans-serif;background:
radial-gradient(circle at 10% 0%,rgba(217,178,76,.12),transparent 24%),linear-gradient(180deg,#0d0b08,#110d09 60%,#0a0907);color:var(--text)}
.wrap{max-width:1500px;margin:auto;padding:22px}.topbar{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--gold2),#8d6512);display:grid;place-items:center;color:#241905;font-size:22px;font-weight:900;box-shadow:0 0 0 1px rgba(255,255,255,.05),0 8px 30px rgba(217,178,76,.18)}
h1{margin:0;font-size:24px}.sub{color:var(--muted);font-size:13px;margin-top:3px}.actions{display:flex;flex-wrap:wrap;gap:8px}
button,.btn{border:1px solid var(--line);background:#1b150d;color:var(--text);padding:9px 13px;border-radius:10px;cursor:pointer;font-weight:700}button:hover{border-color:var(--gold)}button.primary{background:linear-gradient(135deg,#8b6515,var(--gold));color:#171006;border:none}.danger{color:#ffdada;border-color:#693434}.ghost{background:transparent}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:linear-gradient(180deg,rgba(33,25,15,.97),rgba(20,15,10,.98));border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.span12{grid-column:span 12}.span8{grid-column:span 8}.span4{grid-column:span 4}.span6{grid-column:span 6}.metric{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric .box{padding:14px;border-radius:14px;background:#130f0a;border:1px solid #302514}.k{color:var(--muted);font-size:12px}.v{font-size:24px;font-weight:900;margin-top:5px}.pos{color:var(--green)}.neg{color:var(--red)}
.filters,.formgrid{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:10px;align-items:end}label{font-size:12px;color:var(--muted);display:block;margin:0 0 5px}input,select,textarea{width:100%;background:#0f0c08;border:1px solid #3a2d18;color:var(--text);border-radius:10px;padding:9px 10px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--gold)}textarea{min-height:82px;resize:vertical}.form-actions{display:flex;gap:8px;align-items:end;height:100%}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:1250px;background:#100d09}th,td{padding:10px 9px;border-bottom:1px solid #2a2114;text-align:left;font-size:13px;white-space:nowrap}th{position:sticky;top:0;z-index:2;background:#20180f;color:#f5dc95;font-size:12px}tr:hover td{background:#171109}.stock{font-weight:800}.muted{color:var(--muted)}.pill{display:inline-flex;padding:4px 8px;border-radius:999px;border:1px solid #4c3a1d;background:#1a140c;font-size:12px}.pill.open{color:#9ad0ff}.pill.closed{color:#9ce6b6}.row-actions{display:flex;gap:6px}.mini{padding:6px 8px;font-size:12px}.hidden{display:none!important}
.rank-list{display:grid;gap:10px}.rank-row{display:grid;grid-template-columns:42px 1fr 120px 120px;gap:10px;align-items:center;padding:11px;border-radius:12px;background:#130f0a;border:1px solid #332715}.rank-no{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#6c4c0b,var(--gold));font-weight:900;color:#1c1305}.rank-name{font-weight:900}.rank-value{text-align:right;font-weight:900}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.section-title h2{font-size:17px;margin:0}.status{font-size:12px;color:var(--muted)}
.modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.65);z-index:50}.modal.show{display:grid}.modal-card{width:min(460px,92vw);background:#17120c;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 20px 70px rgba(0,0,0,.6)}
@media(max-width:1050px){.span8,.span4,.span6{grid-column:span 12}.metric{grid-template-columns:repeat(2,1fr)}.filters,.formgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.wrap{padding:12px}.topbar{align-items:flex-start;flex-direction:column}.metric{grid-template-columns:1fr 1fr}.filters,.formgrid{grid-template-columns:1fr}.rank-row{grid-template-columns:36px 1fr;}.rank-value{text-align:left}.mobile-hide{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><div class="logo">績</div><div><h1>分析師即時績效表</h1><div class="sub">王榮旭・張貽程・雷老闆｜即時追蹤、出場結算、績效排行</div></div></div>
    <div class="actions">
      <button id="refreshAllBtn">更新全部股價</button>
      <button id="adminBtn" class="primary">管理者登入</button>
      <button id="logoutBtn" class="hidden">離開管理者</button>
    </div>
  </div>

  <div class="grid">
    <section class="card span12">
      <div class="metric">
        <div class="box"><div class="k">目前持股</div><div class="v" id="mOpen">0</div></div>
        <div class="box"><div class="k">未實現損益</div><div class="v" id="mUnrealized">0</div></div>
        <div class="box"><div class="k">已實現損益</div><div class="v" id="mRealized">0</div></div>
        <div class="box"><div class="k">總損益</div><div class="v" id="mTotal">0</div></div>
      </div>
    </section>

    <section class="card span8">
      <div class="section-title"><h2>查詢與篩選</h2><span class="status" id="lastRefresh">更新日期：—</span></div>
      <div class="filters">
        <div><label>分析師</label><select id="fAnalyst"><option value="">全部</option><option>王榮旭</option><option>張貽程</option><option>雷老闆</option></select></div>
        <div><label>持股起日</label><input id="fFrom" type="date"></div>
        <div><label>持股迄日</label><input id="fTo" type="date"></div>
        <div><label>狀態</label><select id="fStatus"><option value="">全部</option><option value="open">持有中</option><option value="closed">已結算</option></select></div>
        <div><label>股票代號 / 名稱</label><input id="fKeyword" placeholder="例如 2330 / 台積電"></div>
        <div class="form-actions"><button id="clearFilterBtn" class="ghost">清除篩選</button></div>
      </div>
    </section>

    <section class="card span4">
      <div class="section-title"><h2>績效排行榜</h2><span class="status">總損益 / 已實現損益</span></div>
      <div id="rankList" class="rank-list"></div>
    </section>

    <section class="card span12 admin-only hidden" id="entryCard">
      <div class="section-title"><h2 id="formTitle">新增交易</h2><span class="status">僅管理者可操作</span></div>
      <div class="formgrid">
        <div><label>分析師</label><select id="analyst"><option>王榮旭</option><option>張貽程</option><option>雷老闆</option></select></div>
        <div><label>股票代號</label><input id="symbol" maxlength="8" placeholder="2330"></div>
        <div><label>股票名稱</label><input id="stockName" placeholder="台積電"></div>
        <div><label>入場日期</label><input id="entryDate" type="date"></div>
        <div><label>進場價(收盤價)</label><input id="entryPrice" type="number" step="0.01"></div>
        <div><label>股數</label><input id="shares" type="number" step="1" value="1000"></div>
        <div><label>停損價</label><input id="stopLoss" type="number" step="0.01"></div>
        <div><label>停利價</label><input id="takeProfit" type="number" step="0.01"></div>
        <div><label>出場日期</label><input id="exitDate" type="date"></div>
        <div><label>出場價格</label><input id="exitPrice" type="number" step="0.01"></div>
        <div style="grid-column:span 2"><label>備註</label><textarea id="note" placeholder="操作邏輯、提醒事項…"></textarea></div>
        <div class="form-actions"><button id="saveBtn" class="primary">儲存</button><button id="cancelEditBtn" class="ghost">清空</button></div>
      </div>
    </section>

    <section class="card span12">
      <div class="section-title"><h2>分析師總績效</h2><span class="status" id="countText">0 筆</span></div>
      <div class="table-wrap"><table><thead><tr>
        <th>分析師</th><th>股票</th><th>入場日期</th><th>進場價(收盤價)</th><th>目前價</th><th>更新日期</th><th>股數</th><th>績效%</th><th>目前損益</th><th>停損</th><th>停利</th><th>出場日期</th><th>出場價</th><th>已實現損益</th><th>狀態</th><th>備註</th><th class="admin-col hidden">操作</th>
      </tr></thead><tbody id="tbody"></tbody></table></div>
    </section>
  </div>
</div>

<div class="modal" id="loginModal"><div class="modal-card"><h3 style="margin-top:0">管理者登入</h3><label>管理者密碼</label><input id="adminPwd" type="password" placeholder="請輸入密碼"><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button id="closeLogin">取消</button><button id="doLogin" class="primary">登入</button></div></div></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
import { getDatabase, ref, onValue, push, set, update, remove } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js';

const FIREBASE_DB_URL='https://analyst-277bd-default-rtdb.firebaseio.com/';
const firebaseConfig={ databaseURL:FIREBASE_DB_URL };
const app=initializeApp(firebaseConfig);
const db=getDatabase(app);
const tradesRef=ref(db,'analystPerformance/trades');

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let trades={}; let isAdmin=false; let editingId=null;
const ADMIN_PASSWORD='51685168';
const fmt=n=>Number(n||0).toLocaleString('zh-TW',{maximumFractionDigits:2});
const fmtMoney=n=>(Number(n||0)>=0?'+':'')+fmt(n);
const pct=n=>(Number(n||0)>=0?'+':'')+Number(n||0).toFixed(2)+'%';
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'});
const nowText=()=>new Date().toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false});

$('#entryDate').value=today(); $('#fFrom').value='2026-09-01'; $('#fTo').value=today();

function calc(t){
  const entry=+t.entryPrice||0, shares=+t.shares||0, current=+t.currentPrice||entry, exit=+t.exitPrice||0;
  const open=!exit;
  const unreal=open?(current-entry)*shares:0;
  const realized=!open?(exit-entry)*shares:0;
  const perf=entry?((open?current:exit)-entry)/entry*100:0;
  return {open,unreal,realized,total:unreal+realized,perf};
}

function filteredEntries(){
  const a=$('#fAnalyst').value, from=$('#fFrom').value, to=$('#fTo').value, st=$('#fStatus').value, kw=$('#fKeyword').value.trim().toLowerCase();
  return Object.entries(trades).filter(([id,t])=>{
    const c=calc(t); const d=t.entryDate||'';
    return (!a||t.analyst===a)&&(!from||d>=from)&&(!to||d<=to)&&(!st||(st==='open'?c.open:!c.open))&&(!kw||String(t.symbol||'').toLowerCase().includes(kw)||String(t.stockName||'').toLowerCase().includes(kw));
  }).sort((a,b)=>(b[1].entryDate||'').localeCompare(a[1].entryDate||''));
}

function render(){
  const rows=filteredEntries(); $('#countText').textContent=`${rows.length} 筆`;
  let html='', openN=0, unreal=0, realized=0;
  rows.forEach(([id,t])=>{ const c=calc(t); if(c.open)openN++; unreal+=c.unreal; realized+=c.realized;
    html+=`<tr><td><b>${esc(t.analyst)}</b></td><td class="stock">${esc(t.symbol)} ${esc(t.stockName)}</td><td>${esc(t.entryDate)}</td><td>${fmt(t.entryPrice)}</td><td>${fmt(t.currentPrice||t.entryPrice)}</td><td>${esc(t.priceUpdatedAt||'—')}</td><td>${fmt(t.shares)}</td><td class="${c.perf>=0?'pos':'neg'}"><b>${pct(c.perf)}</b></td><td class="${c.unreal>=0?'pos':'neg'}">${fmtMoney(c.unreal)}</td><td>${fmt(t.stopLoss)}</td><td>${fmt(t.takeProfit)}</td><td>${esc(t.exitDate||'—')}</td><td>${t.exitPrice?fmt(t.exitPrice):'—'}</td><td class="${c.realized>=0?'pos':'neg'}">${t.exitPrice?fmtMoney(c.realized):'—'}</td><td><span class="pill ${c.open?'open':'closed'}">${c.open?'持有中':'已結算'}</span></td><td title="${esc(t.note||'')}">${esc((t.note||'').slice(0,18))}</td><td class="admin-col ${isAdmin?'':'hidden'}"><div class="row-actions">${c.open?`<button class="mini" data-up="${id}">更新價</button><button class="mini primary" data-settle="${id}">結算</button>`:''}<button class="mini" data-edit="${id}">修改</button><button class="mini danger" data-del="${id}">刪除</button></div></td></tr>`;
  });
  $('#tbody').innerHTML=html||`<tr><td colspan="17" class="muted" style="text-align:center;padding:28px">查無資料</td></tr>`;
  setMetric('#mOpen',openN,false); setMetric('#mUnrealized',unreal,true); setMetric('#mRealized',realized,true); setMetric('#mTotal',unreal+realized,true);
  renderRank(); bindRows();
}
function setMetric(sel,v,money){const el=$(sel);el.textContent=money?fmtMoney(v):fmt(v); if(money){el.classList.toggle('pos',v>=0);el.classList.toggle('neg',v<0)}}
function renderRank(){
  const names=['王榮旭','張貽程','雷老闆'];
  const data=names.map(name=>{let total=0,realized=0;Object.values(trades).filter(t=>t.analyst===name).forEach(t=>{const c=calc(t);total+=c.total;realized+=c.realized});return{name,total,realized}}).sort((a,b)=>b.total-a.total);
  $('#rankList').innerHTML=data.map((r,i)=>`<div class="rank-row"><div class="rank-no">${i+1}</div><div class="rank-name">${r.name}</div><div><div class="k">總損益</div><div class="rank-value ${r.total>=0?'pos':'neg'}">${fmtMoney(r.total)}</div></div><div><div class="k">已實現</div><div class="rank-value ${r.realized>=0?'pos':'neg'}">${fmtMoney(r.realized)}</div></div></div>`).join('');
}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}

function bindRows(){
  $$('[data-edit]').forEach(b=>b.onclick=()=>startEdit(b.dataset.edit));
  $$('[data-del]').forEach(b=>b.onclick=()=>deleteTrade(b.dataset.del));
  $$('[data-up]').forEach(b=>b.onclick=()=>refreshOne(b.dataset.up));
  $$('[data-settle]').forEach(b=>b.onclick=()=>settleTrade(b.dataset.settle));
}

function setAdmin(v){isAdmin=v; localStorage.setItem('analystAdmin',v?'1':'0'); $$('.admin-only').forEach(x=>x.classList.toggle('hidden',!v)); $$('.admin-col').forEach(x=>x.classList.toggle('hidden',!v)); $('#adminBtn').classList.toggle('hidden',v); $('#logoutBtn').classList.toggle('hidden',!v); render()}
if(localStorage.getItem('analystAdmin')==='1')setAdmin(true);

$('#adminBtn').onclick=()=>{$('#loginModal').classList.add('show');$('#adminPwd').focus()}; $('#closeLogin').onclick=()=>$('#loginModal').classList.remove('show');
$('#doLogin').onclick=()=>{if($('#adminPwd').value===ADMIN_PASSWORD){setAdmin(true);$('#loginModal').classList.remove('show');$('#adminPwd').value=''}else alert('密碼錯誤')};
$('#logoutBtn').onclick=()=>setAdmin(false);

$('#saveBtn').onclick=async()=>{
  if(!isAdmin)return; const data={analyst:$('#analyst').value,symbol:$('#symbol').value.trim(),stockName:$('#stockName').value.trim(),entryDate:$('#entryDate').value,entryPrice:+$('#entryPrice').value||0,shares:+$('#shares').value||0,stopLoss:+$('#stopLoss').value||0,takeProfit:+$('#takeProfit').value||0,exitDate:$('#exitDate').value,exitPrice:+$('#exitPrice').value||0,note:$('#note').value.trim(),updatedAt:nowText()};
  if(!data.symbol||!data.entryDate||!data.entryPrice)return alert('請至少填寫股票代號、入場日期與進場價');
  if(editingId){ await update(ref(db,`analystPerformance/trades/${editingId}`),data); } else { const r=push(tradesRef); await set(r,{...data,currentPrice:data.entryPrice,priceUpdatedAt:'尚未更新'}); }
  clearForm();
};
function startEdit(id){const t=trades[id]; if(!t||!isAdmin)return; editingId=id; $('#formTitle').textContent='修改交易'; ['analyst','symbol','stockName','entryDate','entryPrice','shares','stopLoss','takeProfit','exitDate','exitPrice','note'].forEach(k=>$('#'+k).value=t[k]??''); $('#entryCard').scrollIntoView({behavior:'smooth'})}
function clearForm(){editingId=null;$('#formTitle').textContent='新增交易';['symbol','stockName','entryPrice','stopLoss','takeProfit','exitDate','exitPrice','note'].forEach(k=>$('#'+k).value='');$('#shares').value=1000;$('#entryDate').value=today()}
$('#cancelEditBtn').onclick=clearForm;
async function deleteTrade(id){if(!isAdmin)return;if(confirm('確定刪除此筆資料？'))await remove(ref(db,`analystPerformance/trades/${id}`))}

async function settleTrade(id){
  if(!isAdmin)return;
  const t=trades[id];
  if(!t)return;
  const c=calc(t);
  if(!c.open)return alert('此筆已完成結算');
  const defaultPrice=Number(t.currentPrice||t.entryPrice||0);
  const priceText=prompt(`結算 ${t.symbol} ${t.stockName||''}\n請輸入出場價格：`, defaultPrice || '');
  if(priceText===null)return;
  const exitPrice=Number(priceText);
  if(!(exitPrice>0))return alert('請輸入正確的出場價格');
  const dateText=prompt('請輸入出場日期（YYYY-MM-DD）：', today());
  if(dateText===null)return;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(dateText))return alert('出場日期格式請使用 YYYY-MM-DD');
  const realized=(exitPrice-(Number(t.entryPrice)||0))*(Number(t.shares)||0);
  if(!confirm(`確認結算？\n\n${t.analyst}｜${t.symbol} ${t.stockName||''}\n進場價：${fmt(t.entryPrice)}\n出場價：${fmt(exitPrice)}\n已實現損益：${fmtMoney(realized)}\n績效：${pct((exitPrice-(Number(t.entryPrice)||0))/(Number(t.entryPrice)||1)*100)}`))return;
  await update(ref(db,`analystPerformance/trades/${id}`),{
    exitDate:dateText,
    exitPrice,
    currentPrice:exitPrice,
    settledAt:nowText(),
    updatedAt:nowText()
  });
}


['fAnalyst','fFrom','fTo','fStatus','fKeyword'].forEach(id=>$('#'+id).addEventListener(id==='fKeyword'?'input':'change',render));
$('#clearFilterBtn').onclick=()=>{$('#fAnalyst').value='';$('#fStatus').value='';$('#fKeyword').value='';$('#fFrom').value='2026-09-01';$('#fTo').value=today();render()};

// ---- 股價更新：台股官方即時行情優先，Yahoo / Stooq 備援 ----
async function fetchTWSE(sym){
  const channels=[`tse_${sym}.tw`,`otc_${sym}.tw`];
  for(const ch of channels){
    const u=`https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=${encodeURIComponent(ch)}&json=1&delay=0&_=${Date.now()}`;
    try{
      const r=await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,{cache:'no-store'});
      if(!r.ok)continue;
      const j=await r.json(); const d=j?.msgArray?.[0];
      if(!d)continue;
      const raw=(d.z && d.z!=='-')?d.z:(d.y && d.y!=='-')?d.y:null;
      const price=Number(raw);
      if(price>0)return {price,source:ch.startsWith('tse_')?'TWSE':'TPEx'};
    }catch(e){}
  }
  throw new Error('TWSE/TPEx failed');
}
async function fetchYahoo(sym){
  const candidates=[`${sym}.TW`,`${sym}.TWO`,sym];
  for(const s of candidates){
    const urls=[
      `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(s)}?interval=1m&range=1d`,
      `https://query2.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(s)}?interval=1m&range=1d`
    ];
    for(const u of urls){try{const r=await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,{cache:'no-store'}); if(!r.ok)continue; const j=await r.json(); const meta=j?.chart?.result?.[0]?.meta; const p=meta?.regularMarketPrice??meta?.previousClose; if(p)return {price:+p,source:'Yahoo Finance'};}catch(e){}}
  }
  throw new Error('Yahoo failed');
}
async function fetchStooq(sym){
  const code=`${sym}.tw`;
  const u=`https://stooq.com/q/l/?s=${code}&f=sd2t2ohlcv&h&e=csv`;
  const r=await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,{cache:'no-store'}); if(!r.ok)throw new Error('Stooq failed'); const txt=await r.text(); const lines=txt.trim().split(/\r?\n/); if(lines.length<2)throw new Error('Stooq empty'); const arr=lines[1].split(','); const close=+arr[6]; if(!close)throw new Error('Stooq no price'); return {price:close,source:'Stooq'};
}
async function getLatestPrice(symbol){
  try{return await fetchTWSE(symbol)}
  catch(e0){try{return await fetchYahoo(symbol)}
  catch(e1){try{return await fetchStooq(symbol)}
  catch(e2){throw new Error('所有行情來源皆失敗')}}}
}
async function refreshOne(id){if(!isAdmin)return; const t=trades[id]; if(!t)return; const btn=document.querySelector(`[data-up="${id}"]`); if(btn){btn.disabled=true;btn.textContent='更新中'}; try{const q=await getLatestPrice(t.symbol); await update(ref(db,`analystPerformance/trades/${id}`),{currentPrice:q.price,priceUpdatedAt:nowText(),priceSource:q.source}); $('#lastRefresh').textContent=`更新日期：${nowText()}`;}catch(e){alert(`${t.symbol} 股價更新失敗。\n建議：若瀏覽器阻擋跨網域，可改由 Cloudflare Worker / 自有 API Proxy 轉接 Yahoo Finance。`)}finally{if(btn){btn.disabled=false;btn.textContent='更新價'}}}
$('#refreshAllBtn').onclick=async()=>{if(!isAdmin)return alert('更新股價屬管理操作，請先登入管理者'); const ids=Object.keys(trades).filter(id=>calc(trades[id]).open); $('#refreshAllBtn').disabled=true; $('#refreshAllBtn').textContent='更新中…'; let fail=0; for(const id of ids){try{const q=await getLatestPrice(trades[id].symbol); await update(ref(db,`analystPerformance/trades/${id}`),{currentPrice:q.price,priceUpdatedAt:nowText(),priceSource:q.source})}catch(e){fail++}} $('#lastRefresh').textContent=`更新日期：${nowText()}${fail?`（${fail} 筆失敗）`:''}`; $('#refreshAllBtn').disabled=false; $('#refreshAllBtn').textContent='更新全部股價';};

onValue(tradesRef,snap=>{trades=snap.val()||{};render()});
</script>
